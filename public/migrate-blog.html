<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>博客迁移工具 | 吾荣小屋</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-2xl">
  <h1 class="text-2xl font-bold mb-2">📦 博客迁移工具</h1>
  <p class="text-sm text-slate-500 mb-6">从 GitHub 仓库读取现有 Markdown 博客文章，导入到 KV 数据库。迁移完成后请删除此文件。</p>

  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">管理密码</label>
      <input id="pwd" type="password" class="w-full border rounded-lg px-3 py-2" placeholder="ADMIN_PASSWORD">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">GitHub 仓库（owner/repo）</label>
      <input id="repo" class="w-full border rounded-lg px-3 py-2" value="WR-Class/nav-blog" placeholder="owner/repo">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">分支</label>
      <input id="branch" class="w-full border rounded-lg px-3 py-2" value="main">
    </div>
    <button id="migrateBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-semibold">开始迁移</button>
  </div>

  <div id="log" class="mt-6 max-h-80 overflow-auto bg-slate-900 text-slate-200 rounded-lg p-4 text-sm font-mono hidden"></div>

  <div id="done" class="mt-6 hidden p-4 bg-emerald-50 border border-emerald-200 rounded-lg">
    <p class="text-emerald-700 font-medium">✅ 迁移完成！</p>
    <p class="text-sm text-emerald-600 mt-1">请前往 GitHub 仓库删除 <code>src/content/blog/</code> 和 <code>src/content/blog-en/</code> 目录下的 md 文件，然后删除此迁移页面。</p>
    <a href="/blog-editor/" class="inline-block mt-3 text-indigo-600 hover:underline">→ 前往博客编辑器查看</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const OWNER_REPO_DEFAULT = 'WR-Class/nav-blog';
const CONTENT_PATH_ZH = 'src/content/blog/';
const CONTENT_PATH_EN = 'src/content/blog-en/';

function log(msg, color = 'text-slate-200') {
  const div = $('#log');
  div.classList.remove('hidden');
  const line = document.createElement('div');
  line.className = color;
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  div.appendChild(line);
  div.scrollTop = div.scrollHeight;
}

// 解析 frontmatter + body
function parseMd(raw) {
  const m = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: raw };
  const body = m[2];
  const meta = {};
  const lines = m[1].split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const x = line.match(/^([\w]+):\s*(.*)$/);
    if (!x) continue;
    const key = x[1];
    let value = x[2].replace(/^['"]|['"]$/g, '');
    if (key === 'image') {
      const img = {};
      for (let j = i + 1; j < lines.length && /^\s+/.test(lines[j]); j++) {
        const y = lines[j].trim().match(/^(src|alt):\s*(.*)$/);
        if (y) img[y[1]] = y[2].replace(/^['"]|['"]$/g, '');
        i = j;
      }
      meta.image = img;
    } else if (key === 'tags') {
      meta.tags = value.replace(/[\[\]]/g, '').split(',').map(t => t.trim().replace(/"/g, '')).filter(Boolean);
    } else if (key === 'draft') {
      meta.draft = value === 'true';
    } else {
      meta[key] = value;
    }
  }
  return { meta, body };
}

async function ghGet(path) {
  const res = await fetch('https://api.github.com' + path);
  if (!res.ok) throw Error('GitHub API ' + res.status);
  return res.json();
}

$('#migrateBtn').onclick = async () => {
  const pwd = $('#pwd').value.trim();
  const repo = $('#repo').value.trim() || OWNER_REPO_DEFAULT;
  const branch = $('#branch').value.trim() || 'main';
  if (!pwd) { alert('请输入管理密码'); return; }

  $('#migrateBtn').disabled = true;
  $('#migrateBtn').textContent = '迁移中…';

  try {
    // 1. 获取中文博客文件列表
    log('正在从 GitHub 获取博客文件列表…');
    const files = await ghGet(`/repos/${repo}/contents/${CONTENT_PATH_ZH}?ref=${branch}`);
    const mdFiles = files.filter(f => f.name.endsWith('.md'));
    log(`找到 ${mdFiles.length} 篇博客文章`, 'text-emerald-400');

    // 2. 逐篇读取并导入
    for (const file of mdFiles) {
      const slug = file.name.replace(/\.md$/, '');
      log(`正在读取：${file.name}…`);

      // 读取中文版
      const zhData = await ghGet(`/repos/${repo}/contents/${CONTENT_PATH_ZH}${encodeURIComponent(file.name)}?ref=${branch}`);
      const zhRaw = decodeURIComponent(escape(atob(zhData.content.replace(/\n/g, ''))));
      const { meta, body } = parseMd(zhRaw);

      // 尝试读取英文版
      let bodyEn = '';
      try {
        const enData = await ghGet(`/repos/${repo}/contents/${CONTENT_PATH_EN}${encodeURIComponent(file.name)}?ref=${branch}`);
        const enRaw = decodeURIComponent(escape(atob(enData.content.replace(/\n/g, ''))));
        const enParsed = parseMd(enRaw);
        // 只在英文版内容与中文不同时才使用
        if (enParsed.body.trim() !== body.trim()) {
          bodyEn = enParsed.body;
        }
      } catch {}

      // 3. POST 到 /api/blog
      log(`正在导入：${meta.title || slug}…`);
      const payload = {
        slug,
        title: meta.title || slug,
        snippet: meta.snippet || '',
        publishDate: meta.publishDate || new Date().toISOString().slice(0, 10),
        author: meta.author || '吾荣',
        category: meta.category || '未分类',
        tags: meta.tags || [],
        image: meta.image || { src: '', alt: '' },
        draft: meta.draft || false,
        body,
        bodyEn,
        autoTranslate: !bodyEn,
      };

      const res = await fetch('/api/blog', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + pwd },
        body: JSON.stringify(payload),
      });
      const d = await res.json();
      if (!res.ok) throw Error(d.error || '导入失败');
      log(`✅ 导入成功：${meta.title}（${bodyEn ? '含英文' : '自动翻译英文'}）`, 'text-emerald-400');
    }

    log('全部迁移完成！', 'text-emerald-400 font-bold');
    $('#done').classList.remove('hidden');
  } catch (e) {
    log('❌ 错误：' + e.message, 'text-red-400');
  } finally {
    $('#migrateBtn').disabled = false;
    $('#migrateBtn').textContent = '开始迁移';
  }
};
</script>
</body></html>
