<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 | 我的导航博客</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      color: #1a202c;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .login-header p {
      color: #718096;
      font-size: 0.875rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      color: #4a5568;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .error-msg {
      color: #e53e3e;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }
    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }
    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🔐 管理后台</h1>
      <p>请输入密码访问管理后台</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <p class="error-msg" id="errorMsg">密码错误，请重试</p>
      <button type="submit" class="login-btn">登录</button>
    </form>
    <div class="back-link">
      <a href="/">← 返回网站首页</a>
    </div>
  </div>

  <script>
    // 检查是否已登录
    if (localStorage.getItem('admin_logged_in') === 'true' || sessionStorage.getItem('nav_pwd')) {
      localStorage.setItem('admin_logged_in', 'true');
      window.location.href = '/blog-editor/';
    }

    const form = document.getElementById('loginForm');
    const pwdInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = form.querySelector('.login-btn');

    // 处理登录：密码交给后端 /api/verify 校验，前端不再保存明文密码
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = pwdInput.value;
      if (!password) return;
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      const oldTxt = submitBtn.textContent;
      submitBtn.textContent = '校验中…';
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + password },
        });
        if (res.ok) {
          localStorage.setItem('admin_logged_in', 'true');
          try { sessionStorage.setItem('nav_pwd', password); } catch (e) {}
          window.location.href = '/blog-editor/';
          return;
        }
        errorMsg.textContent = '密码错误，请重试';
        errorMsg.style.display = 'block';
        pwdInput.value = '';
      } catch (err) {
        errorMsg.textContent = '校验失败：' + err.message;
        errorMsg.style.display = 'block';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = oldTxt;
    });

    // 回车键登录
    pwdInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        form.dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
