backend:
  name: github
  repo: WR-Class/nav-blog
  branch: main
  base_url: https://nav-blog.pages.dev
  auth_endpoint: /api/auth

media_folder: "public/assets/images"
public_folder: "/assets/images"

media_libraries:
  - name: local
    config:
      public_folder: "/assets/images"

# 界面语言：中文
locale: "zh_Hans"

collections:
  - name: "blog"
    label: "博客文章"
    label_singular: "文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "草稿（勾选后不在网站显示）", name: "draft", widget: "boolean", default: false}
      - {label: "标题", name: "title", widget: "string"}
      - {label: "摘要", name: "snippet", widget: "string"}
      - {label: "发布日期", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "作者", name: "author", widget: "string", default: "吾荣"}
      - {label: "分类", name: "category", widget: "string", default: "未分类"}
      - {label: "标签", name: "tags", widget: "list", default: []}
      - label: "封面图"
        name: "image"
        widget: "object"
        fields:
          - {label: "图片", name: "src", widget: "image", required: false, default: "https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=800&h=600&fit=crop"}
          - {label: "图片说明文字（给看不到图的人和搜索引擎看的描述，可留空）", name: "alt", widget: "string", required: false, default: ""}
      - label: "正文（工具栏支持表格、图片、代码等）"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image", "code-block"]
